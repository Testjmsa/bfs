<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eligibility Check — Bright Future by Sam</title>
<meta name="description" content="ফ্রি Eligibility Check ও সাবজেক্ট কুইজ — মালয়েশিয়ায় কোন কোর্সে আপনি eligible জেনে নিন।">
<link rel="icon" href="images/bfs-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=28">
</head>
<body>
<header id="site-header"></header>
<main>
<section class="page-hero"><div class="wrap">
  <span class="kicker" data-i18n="e.K"></span>
  <h1 data-i18n="e.T"></h1>
  <p class="sub" data-i18n="e.S"></p>
</div></section>

<section class="sec" style="padding-top:20px">
  <div class="wrap">
    <div class="elig card" id="eligBox">
      <div class="steps-bar" id="stepsBar"><span class="sb on"></span><span class="sb"></span><span class="sb"></span><span class="sb"></span></div>
      <form id="eligForm" autocomplete="off" novalidate>
        <div class="estep on" data-step="1">
          <p class="step-label" id="sl1"></p>
          <h3 data-i18n="e.q1"></h3>
          <div class="chips" data-name="edu">
            <button type="button" data-v="ssc">SSC / O-Level</button><button type="button" data-v="hsc">HSC / A-Level</button>
            <button type="button" data-v="diploma">Diploma</button><button type="button" data-v="bachelor">Bachelor's</button><button type="button" data-v="master">Master's</button>
          </div>
          <div class="row2">
            <label class="fld"><span data-i18n="e.gpa"></span><input type="number" step="0.01" min="0" max="5" id="gpa" data-i18n-ph="e.gpaPh" inputmode="decimal"></label>
            <label class="fld"><span>&nbsp;</span><select id="gpaScale"><option value="5" data-i18n="e.s5"></option><option value="4" data-i18n="e.s4"></option></select></label>
          </div>
          <label class="fld"><span data-i18n="e.group"></span>
            <select id="group"><option value="science" data-i18n="g.science"></option><option value="commerce" data-i18n="g.commerce"></option><option value="arts" data-i18n="g.arts"></option><option value="other" data-i18n="g.other"></option></select></label>
        </div>
        <div class="estep" data-step="2">
          <p class="step-label" id="sl2"></p>
          <h3 data-i18n="e.q2"></h3>
          <p class="muted" data-i18n="e.q2n"></p>
          <div class="chips" data-name="eng" id="engChips"></div>
          <label class="fld" id="scoreWrap" hidden><span data-i18n="e.score"></span><input type="number" id="engScore" step="0.5" inputmode="decimal"></label>
        </div>
        <div class="estep" data-step="3">
          <p class="step-label" id="sl3"></p>
          <h3 data-i18n="e.q3"></h3>
          <div class="chips" data-name="field" id="fieldChips"></div>
          <p class="mini"><a href="#quiz" data-i18n="e.quizLink"></a></p>
        </div>
        <div class="estep" data-step="4">
          <p class="step-label" id="sl4"></p>
          <h3 data-i18n="e.q4"></h3>
          <div class="chips" data-name="budget">
            <button type="button" data-v="15000" data-i18n="b.3"></button><button type="button" data-v="25000" data-i18n="b.5"></button><button type="button" data-v="40000" data-i18n="b.8"></button>
            <button type="button" data-v="60000" data-i18n="b.12"></button><button type="button" data-v="999999" data-i18n="b.99"></button>
          </div>
          <label class="fld"><span data-i18n="e.when"></span>
            <select id="when"><option value="asap" data-i18n="w.asap"></option><option value="3" data-i18n="w.3"></option><option value="6" data-i18n="w.6"></option><option value="no" data-i18n="w.no"></option></select></label>
        </div>
        <div class="elig-nav">
          <button type="button" class="btn btn-line" id="ePrev" hidden></button>
          <button type="button" class="btn btn-primary next" id="eNext"></button>
        </div>
      </form>
      <div id="eligResult" hidden></div>
    </div>
  </div>
</section>

<section class="sec quiz-sec" id="quiz">
  <div class="wrap">
    <div class="head center"><span class="kicker" data-i18n="q.K"></span><h2 class="h2" data-i18n="q.T"></h2><p class="sub" data-i18n="q.S"></p></div>
    <div class="quiz card" id="quizBox"></div>
  </div>
</section>
</main>
<footer id="site-footer"></footer>
<script src="js/firebase-config.js?v=24"></script>
<script src="js/i18n.js?v=28"></script>
<script src="js/data.js?v=28"></script>
<script src="CRM Site/js/config.js?v=31"></script>
<script src="CRM Site/js/catalog.js?v=28"></script>
<script src="CRM Site/js/weblink.js?v=6"></script>
<script src="js/common.js?v=28"></script>
<script src="js/sketch.js?v=28"></script>
<script src="js/elig.js?v=28"></script>
</body>
</html>
