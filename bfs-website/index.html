<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bright Future by Sam — Study in Malaysia</title>
<meta name="description" content="মালয়েশিয়ায় পড়াশোনা — ফ্রি কাউন্সেলিং, ফ্রি Eligibility Check, IELTS ও Bank Statement ছাড়াই। Study in Malaysia with Bright Future by Sam, Uttara, Dhaka.">
<link rel="icon" href="images/bfs-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=28">
</head>
<body>
<header id="site-header"></header>

<main>
<section class="hero">
  <div class="hero-bg"></div><div class="hero-grid"></div>
  <div class="wrap hero-in">
    <div>
      <p class="eyebrow"><i></i><span data-i18n="home.eyebrow"></span></p>
      <h1><span data-i18n="home.h1a" style="color:#fff"></span><span data-i18n="home.h1b"></span></h1>
      <p class="lead" data-i18n="home.lead"></p>
      <div class="hero-btns">
        <a href="eligibility.html" class="btn btn-gold btn-lg" id="ctaElig"></a>
        <a href="visit.html" class="btn btn-ghost btn-lg" id="ctaVisit"></a>
      </div>
    </div>
    <div class="hero-visual" aria-hidden="true">
      <div class="hv-card hv-float2"><span class="hv-ic" id="hvIc1"></span><div><b data-i18n="home.s1v"></b><small data-i18n="home.s1l"></small></div></div>
      <div class="hv-card hv-main" id="hvMain"></div>
      <div class="hv-card hv-float"><span class="hv-ic" id="hvIc2"></span><div><b data-i18n="home.s2v"></b><small data-i18n="home.s2l"></small></div></div>
    </div>
  </div>
</section>

<div class="stats"><div class="wrap"><div class="stats-in">
  <div class="stat"><b data-count="20,30,–"></b><span data-i18n="home.s1l"></span></div>
  <div class="stat"><b data-count="24,,+"></b><span data-i18n="home.s2l"></span></div>
  <div class="stat"><b data-count="400,,+"></b><span data-i18n="home.s3l"></span></div>
  <div class="stat"><b data-count="100,,%"></b><span data-i18n="home.s4l"></span></div>
</div></div></div>

<section class="sec">
  <div class="wrap">
    <div class="head reveal"><span class="kicker" data-i18n="home.whyK"></span><h2 class="h2" data-i18n="home.whyT"></h2><p class="sub" data-i18n="home.whyS"></p></div>
    <div class="why-grid" id="whyGrid"></div>
  </div>
</section>

<section class="sec sec-tint">
  <div class="wrap">
    <div class="head center reveal"><span class="kicker" data-i18n="home.toolsK"></span><h2 class="h2" data-i18n="home.toolsT"></h2></div>
    <div class="tools" id="tools"></div>
  </div>
</section>

<section class="sec">
  <div class="wrap">
    <div class="head center reveal"><span class="kicker" data-i18n="home.unisK"></span><h2 class="h2" data-i18n="home.unisT"></h2></div>
  </div>
  <div class="logo-marquee reveal"><div class="lm-track" id="lmTrack"></div></div>
  <p class="center" style="margin-top:34px"><a href="universities.html" class="btn btn-primary" id="unisBtn"></a></p>
</section>

<section class="sec sec-tint">
  <div class="wrap">
    <div class="head center reveal"><span class="kicker" data-i18n="home.jK"></span><h2 class="h2" data-i18n="home.jT"></h2></div>
    <div class="journey" id="journey"></div>
  </div>
</section>

<section class="cta-band"><div class="wrap"><div class="cta-in reveal">
  <div><h2 data-i18n="cta.t"></h2><p data-i18n="cta.s"></p></div>
  <a href="visit.html" class="btn btn-gold btn-lg" id="ctaBand"></a>
</div></div></section>
</main>

<footer id="site-footer"></footer>
<script src="js/firebase-config.js?v=24"></script>
<script src="js/i18n.js?v=28"></script>
<script src="js/data.js?v=28"></script>
<script src="CRM Site/js/config.js?v=31"></script>
<script src="CRM Site/js/catalog.js?v=28"></script>
<script src="CRM Site/js/weblink.js?v=6"></script>
<script src="js/common.js?v=28"></script>
<script src="js/sketch.js?v=28"></script>
<script>
function renderHome() {
  $("#ctaElig").innerHTML = icon("target") + `<span>${t("home.cta1")}</span>`;
  $("#ctaVisit").innerHTML = icon("map") + `<span>${t("home.cta2")}</span>`;
  $("#ctaBand").innerHTML = icon("calendar") + `<span>${t("cta.btn")}</span>`;
  $("#unisBtn").innerHTML = `<span>${t("home.unisBtn")}</span>` + icon("arrow");
  $("#hvIc1").innerHTML = icon("bolt"); $("#hvIc2").innerHTML = icon("building");
  $("#hvMain").innerHTML = `<h3>${t("tool.elig")}</h3>` + [
    ["cap", "SSC / O-Level", LEVEL_NAME.F], ["book", "HSC / A-Level", LEVEL_NAME.B], ["briefcase", "Bachelor's", LEVEL_NAME.M], ["star", "Master's", LEVEL_NAME.P],
  ].map(([i, a, b]) => `<div class="hv-row"><b>${icon(i)}</b><span>${a} → ${L(b)}</span><em>${icon("check")} ${t("e.ok")}</em></div>`).join("");
  $("#whyGrid").innerHTML = WHY_MALAYSIA.map((w, i) => `
    <article class="why tilt reveal ${i % 3 ? "d" + (i % 3) : ""}"><span class="why-n">${num(String(i + 1).padStart(2, "0"))}</span>
      <div class="why-ic">${icon(w.icon)}</div><h3>${esc(L(w.title))}</h3><p>${esc(L(w.text))}</p></article>`).join("");
  $("#tools").innerHTML = [["eligibility.html", "target", "tool.elig", "tool.eligD"], ["universities.html", "building", "tool.unis", "tool.unisD"], ["cost.html", "calc", "tool.cost", "tool.costD"], ["eligibility.html#quiz", "puzzle", "tool.quiz", "tool.quizD"]]
    .map(([h, i, a, b], k) => `<a href="${h}" class="tool tilt reveal d${k}"><span class="ti">${icon(i)}</span><h3>${t(a)}</h3><p>${t(b)}</p><span class="go">${isBn() ? "শুরু করো" : "Open"} ${icon("arrow")}</span></a>`).join("");
  const logos = UNIVERSITIES.map((u) => `<a class="lm-item" href="universities.html#${u.id}" title="${esc(u.name)}"><img src="${logoSrc(u.id)}" alt="${esc(u.name)}" loading="lazy"></a>`).join("");
  $("#lmTrack").innerHTML = logos + logos;
  $("#journey").innerHTML = JOURNEY.map((j, i) => `<div class="j tilt reveal d${i % 3}"><span>${num(i + 1)}</span><b>${esc(L(j.t))}</b><p>${esc(L(j.d))}</p></div>`).join("");
  reveal();
}
/* সংখ্যাগুলো ০ থেকে গুনে গুনে বাড়ে */
let counted = false;
function drawCount(p) {
  $$("[data-count]").forEach((el) => {
    const [a, b, s] = el.dataset.count.split(","), A = Math.round(+a * p), B = b ? Math.round(+b * p) : null;
    el.textContent = B != null ? `${num(A)}${s}${num(B)}` : `${num(A)}${s}`;
  });
}
function countUp() {
  const box = $(".stats-in"); drawCount(counted ? 1 : 0);
  if (counted) return;
  const run = () => {
    if (counted) return; counted = true; removeEventListener("scroll", check);
    if (CALM) return drawCount(1);
    const t0 = performance.now(), D = 1600;
    const step = () => { const k = Math.min(1, (performance.now() - t0) / D); drawCount(1 - Math.pow(1 - k, 3)); if (k < 1) setTimeout(step, 30); };
    step();
  };
  const check = () => { const r = box.getBoundingClientRect(); if (r.top < innerHeight * 0.92 && r.bottom > 0) run(); };
  addEventListener("scroll", check, { passive: true }); check();
  const iv = setInterval(() => (counted ? clearInterval(iv) : check()), 400);
}document.addEventListener("DOMContentLoaded", () => { renderHome(); countUp(); });
document.addEventListener("bfs:lang", () => drawCount(counted ? 1 : 0));
document.addEventListener("bfs:lang", renderHome);
</script>
</body>
</html>
