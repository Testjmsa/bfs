<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universities — Bright Future by Sam</title>
<meta name="description" content="মালয়েশিয়ার ২৪+ ইউনিভার্সিটি ও ৩৫০+ প্রোগ্রামের আনুমানিক ফি। Malaysian universities and programme fees.">
<link rel="icon" href="images/bfs-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=28">
</head>
<body>
<header id="site-header"></header>
<main>
<section class="page-hero"><div class="wrap">
  <span class="kicker" data-i18n="unis.K"></span>
  <h1 data-i18n="unis.T"></h1>
  <p class="sub" data-i18n="unis.S"></p>
</div></section>

<section class="sec" style="padding-top:30px">
  <div class="wrap">
    <div class="uni-tools">
      <div class="searchbox" id="uSearchBox"><input class="input" id="uSearch" type="search" data-i18n-ph="unis.search" aria-label="search"></div>
    </div>
    <div class="chips" id="uFilter" style="margin-bottom:24px"></div>
    <div class="uni-grid" id="uniGrid"></div>
  </div>
</section>

<section class="sec sec-tint" id="programs">
  <div class="wrap">
    <div class="head"><span class="kicker" data-i18n="unis.progK"></span><h2 class="h2" data-i18n="unis.progT"></h2></div>
    <div class="filters">
      <div class="searchbox" id="pSearchBox"><input class="input" id="pSearch" type="search" data-i18n-ph="unis.progPh" aria-label="search"></div>
      <select class="input" id="pLevel" aria-label="level"></select>
      <select class="input" id="pField" aria-label="field"></select>
      <select class="input" id="pUni" aria-label="university"></select>
    </div>
    <p class="result-count" id="pCount"></p>
    <div class="vary-note" id="pVary"></div>
    <div class="prog-grid" id="progGrid"></div>
    <div class="more-row"><button class="btn btn-line" id="pMore" data-i18n="unis.moreBtn"></button></div>
  </div>
</section>
</main>

<div class="modal" id="uModal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="modal-box" id="mBox"></div></div>

<footer id="site-footer"></footer>
<script src="js/firebase-config.js?v=24"></script>
<script src="js/i18n.js?v=28"></script>
<script src="js/data.js?v=28"></script>
<script src="CRM Site/js/config.js?v=31"></script>
<script src="CRM Site/js/catalog.js?v=28"></script>
<script src="CRM Site/js/weblink.js?v=6"></script>
<script src="js/common.js?v=28"></script>
<script src="js/sketch.js?v=28"></script>
<script src="js/unis.js?v=28"></script>
</body>
</html>
