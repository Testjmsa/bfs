<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cost Calculator — Bright Future by Sam</title>
<meta name="description" content="মালয়েশিয়ায় পড়ার মোট খরচ RM-এ হিসাব করুন — টিউশন ও থাকা-খাওয়া।">
<link rel="icon" href="images/bfs-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=28">
</head>
<body>
<header id="site-header"></header>
<main>
<section class="page-hero"><div class="wrap">
  <span class="kicker" data-i18n="cost.K"></span><h1 data-i18n="cost.T"></h1><p class="sub" data-i18n="cost.S"></p>
</div></section>
<section class="sec" style="padding-top:20px"><div class="wrap">
  <div class="cost card">
    <div class="cost-in">
      <h3 data-i18n="cost.tuition"></h3>
      <label class="fld"><span data-i18n="cost.uni"></span><select id="cUni"></select></label>
      <label class="fld"><span data-i18n="cost.prog"></span><select id="cProg"></select></label>
      <h3 data-i18n="cost.living"></h3>
      <div class="slider"><div><span data-i18n="cost.rent"></span><b id="vRent"></b></div><input type="range" id="cRent" min="400" max="1500" step="50" value="600" aria-label="rent"></div>
      <div class="slider"><div><span data-i18n="cost.food"></span><b id="vFood"></b></div><input type="range" id="cFood" min="300" max="1200" step="50" value="500" aria-label="food"></div>
      <div class="slider"><div><span data-i18n="cost.trans"></span><b id="vTrans"></b></div><input type="range" id="cTrans" min="50" max="400" step="10" value="120" aria-label="transport"></div>
      <div class="slider"><div><span data-i18n="cost.other"></span><b id="vOther"></b></div><input type="range" id="cOther" min="50" max="600" step="10" value="150" aria-label="other"></div>
    </div>
    <div class="cost-out" aria-live="polite">
      <div class="co-row"><span data-i18n="cost.tYear"></span><b id="oTuition"></b></div>
      <div class="co-row"><span id="oEmgsL"></span><b id="oEmgs"></b></div>
      <div class="co-row"><span data-i18n="cost.month"></span><b id="oMonth"></b></div>
      <div class="co-row"><span data-i18n="cost.lYear"></span><b id="oLiving"></b></div>
      <div class="co-total"><small data-i18n="cost.total"></small><div class="big" id="oTotal"></div><div class="big2" id="oTotalRM"></div></div>
      <p class="mini" id="oRate"></p>
      <a href="visit.html" class="btn btn-gold" id="oCta"></a>
    </div>
  </div>
</div></section>
</main>
<footer id="site-footer"></footer>
<script src="js/firebase-config.js?v=24"></script>
<script src="js/i18n.js?v=28"></script>
<script src="js/data.js?v=28"></script>
<script src="CRM Site/js/config.js?v=31"></script>
<script src="CRM Site/js/catalog.js?v=28"></script>
<script src="CRM Site/js/weblink.js?v=6"></script>
<script src="js/common.js?v=28"></script>
<script src="js/sketch.js?v=28"></script>
<script>
const ids = ["Rent", "Food", "Trans", "Other"];
function fillUnis() {
  const v = $("#cUni").value;
  $("#cUni").innerHTML = `<option value="">${t("cost.noUni")}</option>` + UNIVERSITIES.map((u) => `<option value="${u.id}">${esc(u.name)}</option>`).join("");
  $("#cUni").value = v || "segi"; fillProgs();
}
function fillProgs() {
  const v = $("#cProg").value, u = $("#cUni").value;
  const list = ALLPROGS.filter((p) => p.uni === u);
  $("#cProg").innerHTML = list.length ? list.map((p) => `<option value="${p.id}">${L(LEVEL_NAME[p.lv])} — ${esc(p.name)}</option>`).join("") : `<option value="">${t("m.noProg")}</option>`;
  $("#cProg").disabled = !list.length;
  if (list.some((p) => p.id === v)) $("#cProg").value = v;
  else { const b = list.find((p) => p.lv === "B"); if (b) $("#cProg").value = b.id; }
  calc();
}
function calc() {
  let m = 0; ids.forEach((k) => { const v = +$("#c" + k).value; m += v; $("#v" + k).textContent = "RM " + money(v); });
  const uid = $("#cUni").value, p = ALLPROGS.find((x) => x.id === $("#cProg").value && x.uni === uid);
  const tuit = p ? costOf(p).firstTuition : 0;
  const e = uid ? emgsOf(uid) : null, emgs = uid ? (e ? e.rm : CONFIG.emgsDefault) : 0;
  const tot = tuit + (e?.inFee ? 0 : emgs) + m * 12;   // ফি-তে ভিসা ধরা থাকলে আবার যোগ হবে না
  $("#oTuition").textContent = p ? `RM ${money(tuit)}` : "—";
  $("#oEmgsL").innerHTML = t("pc.emgs") + (uid && !e ? ` <em class="vary">${t("pc.approx")}</em>` : e?.inFee ? ` <em class="vary">${t("pc.inFee")}</em>` : "");
  $("#oEmgs").textContent = uid ? `RM ${money(emgs)}` : "—";
  $("#oMonth").textContent = `RM ${money(m)}`;
  $("#oLiving").textContent = `RM ${money(m * 12)}`;
  $("#oTotal").textContent = `RM ${money(tot)}`;
  $("#oTotalRM").textContent = t("c.vary");
  $("#oRate").textContent = e ? "EMGS: " + L(e.src) : "";
  $("#oCta").innerHTML = icon("calendar") + `<span>${t("cost.cta")}</span>`;
}document.addEventListener("DOMContentLoaded", () => {
  fillUnis();
  $("#cUni").addEventListener("change", fillProgs);
  $("#cProg").addEventListener("change", calc);
  ids.forEach((k) => $("#c" + k).addEventListener("input", calc));
});
document.addEventListener("bfs:lang", fillUnis);
</script>
</body>
</html>
