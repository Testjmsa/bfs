<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a Free Visit — Bright Future by Sam</title>
<meta name="description" content="উত্তরা অফিসে ফ্রি কাউন্সেলিং বুক করুন। Book free counselling at our Uttara office.">
<link rel="icon" href="images/bfs-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=28">
</head>
<body>
<header id="site-header"></header>
<main>
<section class="page-hero"><div class="wrap">
  <span class="kicker" data-i18n="v.K"></span><h1 data-i18n="v.T"></h1><p class="sub" data-i18n="v.S"></p>
</div></section>
<section class="sec" style="padding-top:20px"><div class="wrap">
  <div class="perks" id="perks"></div>
  <div id="vSum"></div>
  <div class="book card" id="book">
    <div class="book-cal">
      <div class="cal-head"><button type="button" id="calPrev" aria-label="previous month">‹</button><b id="calTitle"></b><button type="button" id="calNext" aria-label="next month">›</button></div>
      <div class="cal-grid" id="calGrid"></div>
      <p class="mini muted" style="margin-top:10px" data-i18n="v.closed"></p>
      <div class="slots" id="slots"></div>
    </div>
    <form class="book-form" id="bookForm" novalidate>
      <h3 data-i18n="v.bookT"></h3>
      <div class="chips" id="modeChips"></div>
      <label class="fld"><span data-i18n="v.name"></span><input id="bName" required autocomplete="name"></label>
      <label class="fld"><span data-i18n="v.mobile"></span><span id="bPhoneBox"></span></label>
      <label class="fld"><span data-i18n="v.level"></span>
        <select id="bLevel"><option value="fd" data-i18n="lv.fd"></option><option value="b" data-i18n="lv.b"></option><option value="m" data-i18n="lv.m"></option><option value="p" data-i18n="lv.p"></option><option value="e" data-i18n="lv.e"></option><option value="x" data-i18n="lv.x"></option></select></label>
      <label class="fld"><span data-i18n="v.note"></span><textarea id="bNote" rows="2"></textarea></label>
      <div class="picked" id="picked"></div>
      <button class="btn btn-primary btn-lg wide" type="submit" id="bSubmit"></button>
      <p class="mini muted center" style="margin-top:10px" data-i18n="v.after"></p>
    </form>
  </div>
  <div class="office">
    <div class="card"><h3 data-i18n="v.officeT"></h3><p id="oAddr"></p><p id="oPhones" style="flex-direction:column;gap:4px"></p>
      <a class="btn btn-line" id="dirBtn" target="_blank" rel="noopener"></a></div>
    <iframe id="map" title="Office map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>
</div></section>
</main>
<footer id="site-footer"></footer>
<script src="js/firebase-config.js?v=24"></script>
<script src="js/i18n.js?v=28"></script>
<script src="js/data.js?v=28"></script>
<script src="CRM Site/js/config.js?v=31"></script>
<script src="CRM Site/js/catalog.js?v=28"></script>
<script src="CRM Site/js/weblink.js?v=6"></script>
<script src="js/common.js?v=28"></script>
<script src="js/sketch.js?v=28"></script>
<script src="js/visit.js?v=28"></script>
</body>
</html>
